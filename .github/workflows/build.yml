name: Build and publish

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch or tag to build
        required: true
        default: main
        type: string
      tests_only:
        description: Run the test suite only; do not build or publish an image
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r test/requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key
          DB_NAME: portfolio_test
          DB_USER: portfolio
          DB_PASSWORD: portfolio
          DB_HOST: localhost
          DB_PORT: '5432'
        run: python -m pytest --ds=api.settings test

  build:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !inputs.tests_only }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          BRANCH_TAG=$(echo "${BRANCH}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9._-]#-#g')

          TIMESTAMP=$(TZ=Europe/Rome date '+%d-%m-%Y_%H-%M')

          echo "tag=${BRANCH_TAG}-${TIMESTAMP}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          ECR_REPO_URL: ${{ secrets.ECR_REPO_URL }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build \
            -t "${ECR_REPO_URL}:${IMAGE_TAG}" \
            .

      - name: Push Docker image
        env:
          ECR_REPO_URL: ${{ secrets.ECR_REPO_URL }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker push \
            "${ECR_REPO_URL}:${IMAGE_TAG}"

      - name: Summary
        env:
          ECR_REPO_URL: ${{ secrets.ECR_REPO_URL }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          echo "Image published:"
          echo "${ECR_REPO_URL}:${IMAGE_TAG}"
